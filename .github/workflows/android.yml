name: Android build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure required SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true
          link-to-sdk: true

      # Android NDK r23+ dropped the GNU-binutils-style prefixed tools (e.g.
      # aarch64-linux-android-ranlib), keeping only the unprefixed llvm-* ones. Vendored OpenSSL's
      # build (a dependency of the Android git backend's git2 crate) still shells out to the old
      # prefixed names directly, so put symlinks back for every target this workflow builds.
      - name: Restore legacy binutils names the NDK dropped
        run: |
          bin="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for triple in aarch64-linux-android arm-linux-androideabi armv7a-linux-androideabi i686-linux-android x86_64-linux-android; do
            for tool in ar ranlib nm strip objcopy objdump; do
              link="$bin/$triple-$tool"
              [ -e "$link" ] || ln -s "$bin/llvm-$tool" "$link"
            done
          done

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Init Android project
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: npx tauri android init --ci

      # Release builds must be signed to be installable at all. This key is generated once
      # (openssl, not keytool — see the commit that added this step) and stored as repo secrets;
      # losing it means future releases can never update an install of an earlier one, so it's
      # also kept outside CI. See src-tauri/gen/android/keystore.properties' consumer in
      # app/build.gradle.kts for how Tauri's Android template wires this file up.
      - name: Set up Android release signing
        run: |
          cd src-tauri/gen/android
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > "$RUNNER_TEMP/release.p12"
          echo "storeFile=$RUNNER_TEMP/release.p12" >> keystore.properties

      # The symlinks above cover most tools that shell out to the old prefixed names, but vendored
      # OpenSSL's Configure hardcodes an unqualified "<triple>-ranlib" into its Makefile without
      # prepending the NDK's bin dir, so it depends on PATH resolution order at the moment make
      # runs it — fragile. llvm-ranlib/llvm-ar are target-agnostic (they just index/archive object
      # files, unlike the compiler), so pointing RANLIB/AR at them directly sidesteps that
      # entirely, for every one of the 4 architectures being built here.
      - name: Build release APK
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          RANLIB: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib
          AR: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
        run: npx tauri android build --apk

      - name: Locate APK
        id: apk
        run: |
          apk=$(find src-tauri/gen/android -name "*.apk" | head -n 1)
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: forward-flow-android-release
          path: ${{ steps.apk.outputs.path }}

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
