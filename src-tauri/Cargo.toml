[package]
name = "forward-flow"
version = "0.4.0"
description = "Append-only zen writing"
authors = ["Karan Goel"]
edition = "2021"

[features]
tls-diagnostics = []

[lib]
name = "forward_flow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

# Compile libgit2 on desktop too for local type checks and tests.
git2 = { version = "0.19", default-features = false }
tauri-plugin-opener = "=2.5.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Android embeds libgit2 and OpenSSL for HTTP(S) sync without system libraries.
[target.'cfg(target_os = "android")'.dependencies]
git2 = { version = "0.19", default-features = false, features = ["vendored-openssl", "vendored-libgit2", "https"] }

libgit2-sys = "0.17"
openssl = { version = "0.10", features = ["vendored"] }
openssl-sys = "0.9"
foreign-types = "0.3"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
